#
# Tests of the core with the real RISC-V debug module (pulp_riscv_dbg dm_top, with the
# CHERIoT patches), driven over its DMI port by core_ibex_dm_test.
#
# They need the DM build of the testbench and are skipped by all_directed without it
# (requires_dm, scripts/metadata.py):
#   make uvm-test-xlm TEST=dm_basic,dm_basic_cheriot DM=1
# DM=1 compiles core_ibex_tb_top with +define+IBEX_DM_REAL and ibex_dv_dm.f: dm_top behind
# ibex_dm_obi_mux on both core buses, the core's DmHaltAddr/DmExceptionAddr at the debug ROM
# (0x1A11_0800 / 0x1A11_0810), debug_req_i from dm_top instead of the TB debug agent.
#
# Cosim off: neither Spike nor CHERIoT-Sail models the debug module's ROM and abstract-command
# memory, so the tests are self-checking (DMI read-back in core_ibex_dm_test, register checks in
# the program after resume). +disable_spurious_dside_responses=1: a spurious d-side response
# would land among the DM's one-cycle responses (ibex_dm_obi_mux asserts against that) and is not
# what these tests are about.
#
# Configs are shared across the directed testlists; cheriot-dv-tests (directed_testlist_cheriot_
# traps.yaml) links at 0x80000000 with the rv32imc toolchain and needs no crt.

- test: dm_basic
  desc: >
    Real debug module, RISC-V mode. The program fills registers and spins; over DMI the test
    activates the DM, halts the hart, reads GPRs (x8-x15, x16, x31) and dcsr/dpc with abstract
    commands, checks that a 64-bit access is refused (cmderr 2) and that an abstract read of an
    unimplemented CSR reports the debug-mode exception (cmderr 3), runs a program buffer
    (addi a1; ebreak), writes x20 and the mailbox a2, and resumes. The program then checks the
    written registers and that s0/a0, which every abstract command borrows, were restored.
    Self-checking, cosim off. Returns 0 on success; codes in the test header.
  iterations: 1
  test_srcs: dm_basic/dm_basic.S
  config: cheriot-dv-tests
  rtl_test: core_ibex_dm_test
  requires_dm: true
  sim_opts: "+cosim_off=1 +disable_spurious_dside_responses=1"

- test: dm_basic_cheriot
  desc: >
    Real debug module, CHERIoT mode (cheriot_enable_i asserted from reset, so the DM selects its
    CHERIoT debug ROM and CSpecialRW scratch handling). As dm_basic, plus 64-bit abstract register
    reads of capability registers (s0, s1, a0, a5: address in data0, metadata in data1, checked
    against the program's own csc images; the tag from the testbench's view of the core's store to
    data0) and of DEPCC through the SCR path, a 64-bit write of an untagged capability to a4, and
    an abstract read of x16 that must fault (no x16 in CHERIoT mode, cmderr 3). After resume the
    program checks that s0/a0 kept their tags (DScratchC0/1) and the capability written to a4.
    Self-checking, cosim off. Returns 0 on success; codes in the test header.
  iterations: 1
  test_srcs: dm_basic_cheriot/dm_basic_cheriot.S
  config: cheriot-dv-tests
  rtl_test: core_ibex_dm_test
  requires_dm: true
  sim_opts: "+enable_cheriot_seq=1 +cosim_off=1 +disable_spurious_dside_responses=1"

- test: dm_corners_cheriot
  desc: >
    Debug-mode corner cases through the real debug module, CHERIoT mode (REQ_DBG_03, REQ_DBG_04,
    REQ_DBG_05, REQ_SCR_01). The program's PCC and MTCC are bounded away from the debug memory.
    Outside debug mode, SCRs 24-26 are illegal (mcause 2). Halted: an ecall and an illegal
    instruction in the program buffer give cmderr 3 and change no CSR; program buffers load,
    store, CLC and CSC beyond a5's top, through an untagged a4 and through a3 with only GL, with
    no fault (cmderr 0), the right data, the CLC'd capability unattenuated and tagged, and the
    CSC'd capability stored with its tag (checked by the program after resume); DEPCC and
    DScratchC0/1 read and written in the program buffer. Then DEPCC := untagged, sealed, without
    EX, and dret: the first fetch faults (mcause 28; mtval 0x402 untagged, mtval[10:5] = PCC
    otherwise). Then dcsr.prv := 0..3: only M reads back, and dret returns to M (ecall cause 11).
    Self-checking, cosim off. +dm_inject_fail=1 makes one expectation wrong and the run must
    fail. Returns 0 on success; codes in the test header.
  iterations: 1
  test_srcs: dm_corners_cheriot/dm_corners_cheriot.S
  config: cheriot-dv-tests
  rtl_test: core_ibex_dm_corners_test
  requires_dm: true
  sim_opts: "+enable_cheriot_seq=1 +cosim_off=1 +disable_spurious_dside_responses=1"

- test: dm_corners
  desc: >
    dm_corners_cheriot's dcsr.prv phases in RISC-V mode (REQ_DBG_04): the program buffer
    exception probes, misa (U, no S), then dcsr.prv := 0..3 through the real debug module. U and
    M read back as written, 1 and 2 as U or M (Debug Spec dcsr.prv WARL), and dret returns to the
    level read back (ecall cause 8 or 11; PMP entry 0 lets U-mode run). Self-checking, cosim off.
    +dm_inject_fail=1 expects dcsr.prv 0 after writing 3 and must fail. Returns 0 on success;
    codes in the test header.
  iterations: 1
  test_srcs: dm_corners/dm_corners.S
  config: cheriot-dv-tests
  rtl_test: core_ibex_dm_corners_test
  requires_dm: true
  sim_opts: "+cosim_off=1 +disable_spurious_dside_responses=1"
