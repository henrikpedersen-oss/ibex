#
# White-box directed tests.
#
# These target specific internal states rather than architectural behaviour --
# LSU cap_rx_fsm beats, fetch-FIFO occupancy, prefetch/branch interaction,
# mcountinhibit gating. Kept in their own testlist so the suite can be
# maintained and reviewed separately from the architectural directed tests in
# directed_testlist.yaml; metadata.py loads every directed_testlist*.yaml in
# this directory.
#
# Migrated from ibex-private 2026-09-18, where they lived in
# directed_testlist_agent.yaml and drove a separate build against that repo.
#
# Each test is self-contained (one .S, no extra sources) and returns 0 on
# success with a numbered failure code otherwise -- see each entry's desc.
# Those codes only became observable on 2026-09-18: crt_cheriot.S reported
# TEST_PASS unconditionally until then, so these tests could not fail.


- test: wb_fetch_fifo_full
  desc: >
    White-box fetch-FIFO full state (ibex_fetch_fifo DEPTH=3).  A ~32-cycle DIVU
    stall allows the prefetch buffer to fill all three FIFO slots.  A branch
    afterward exercises the FIFO-flush + prefetch-redirect path.  Tests that
    no instruction is lost or corrupted when the FIFO reaches maximum occupancy.
    Returns 0 on success; 1=wrong first DIVU, 2=wrong second DIVU, 3-5=interrupt
    state divergence.
  iterations: 1
  test_srcs: wb_fetch_fifo_full/wb_fetch_fifo_full.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_fetch_fifo_single
  desc: >
    White-box fetch-FIFO single-entry state (ibex_fetch_fifo fifo_valid_n=1).
    Two back-to-back far JALs flush the FIFO and restart the prefetcher, so
    exactly one instruction is buffered before it is decoded.  Exercises the
    FIFO in its single-occupancy state on two successive prefetch restarts.
    Returns 0 on success; 1=arithmetic wrong after jumps, 2-4=interrupt state.
  iterations: 1
  test_srcs: wb_fetch_fifo_single/wb_fetch_fifo_single.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_prefetch_branch
  desc: >
    White-box prefetch-branch timing: branch while an instruction fetch is
    outstanding (ibex_prefetch_buffer prefetch_branch signal during in-flight
    request).  Three consecutive unconditional and conditional branches exercise
    the branch_req path before and during outstanding prefetches.  Also verifies
    the not-taken branch path after a branch resolve.  Returns 0 on success;
    1=arithmetic wrong, 3-5=interrupt state.
  iterations: 1
  test_srcs: wb_prefetch_branch/wb_prefetch_branch.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_instr_stall_loop
  desc: >
    White-box sustained fetch stall: four consecutive ~32-cycle DIVU operations
    keep the pipeline stalled for ~128 cycles total, holding the fetch FIFO near
    maximum occupancy across multiple fill/drain cycles.  Exercises prolonged
    FIFO-full states analogous to many cycles of instr_gnt_i=0.  Sum of four
    quotients (700/7 + 800/8 + 900/9 + 600/6 = 400) verifies no stall corruption.
    Returns 0 on success; 1=wrong sum, 2-4=interrupt state.
  iterations: 1
  test_srcs: wb_instr_stall_loop/wb_instr_stall_loop.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_branch_after_stall
  desc: >
    White-box data-dependent branch after multi-cycle EX stall (ibex_controller
    branch_req from WB stage after MUL/DIV stall).  Branch condition depends on
    DIVU result, so the branch cannot resolve until the divide completes.  Tests
    both taken and not-taken paths.  Returns 0 on success; 1=taken branch wrong,
    2=not-taken branch wrong, 3-5=interrupt state.
  iterations: 1
  test_srcs: wb_branch_after_stall/wb_branch_after_stall.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_cheri_clc_csc
  desc: >
    White-box CHERIoT CLC two-beat cap_rx_fsm (ibex_load_store_unit.sv states
    CRX_IDLE → CRX_WAIT_RESP1 → CRX_WAIT_RESP2).  Stores MTCC via CSC then
    loads it back via CLC, verifying tag=1.  Back-to-back CLCs exercise
    consecutive cap_rx_fsm cycles.  An integer SW to the same address then a
    CLC confirms tag revocation (CHERIoT temporal safety, tag=0).
    Returns 0 on success; 1=CLC tag wrong, 2=back-to-back CLC wrong,
    3=revocation failed, 4-6=interrupt state.
  iterations: 1
  test_srcs: wb_cheri_clc_csc/wb_cheri_clc_csc.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_cheri_sentry_cjalr
  desc: >
    White-box CHERIoT sentry CJALR path (cheri_ex.sv CJALR + CSeal, otype=1).
    Derives a code capability from PCC via AUIPCC, moves its cursor to a target
    label, seals it with MScratchC (cursor=1 = OTYPE_SENTRY), then jumps through
    it with CJALR.  Verifies: sentry tag=1 before jump, otype=1 before jump,
    ra.cap.otype=5 (OTYPE_SENTRY_IE_BKWD, MIE=1 at jump time), ra.cap.tag=1
    after jump.  Returns 0 on success; 1-7 identify specific failing checks.
  iterations: 1
  test_srcs: wb_cheri_sentry_cjalr/wb_cheri_sentry_cjalr.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_cheri_trap_mret
  desc: >
    White-box ibex_controller ECALL trap entry and MRET wakeup path (same
    controller FSM path as WFI wakeup).  Installs a 256-byte-aligned mtvec,
    executes ECALL (mcause=11), verifies the handler fires, then MRET resumes at
    mepc+4.  Checks mcause, mepc, and MIE restoration.  The 256-byte alignment
    is required for Spike cosim agreement (Ibex WARL vs Spike MTVEC granularity).
    Returns 0 on success; 1=handler not called, 2=wrong mcause, 3=wrong mepc,
    4=MIE not restored, 5=mip non-zero.
  iterations: 1
  test_srcs: wb_cheri_trap_mret/wb_cheri_trap_mret.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_lsu_misaligned
  desc: >
    White-box ibex_load_store_unit misaligned word load (handle_misaligned_q
    two-beat split access).  Stores two known 32-bit words to a 4-byte-aligned
    scratch address, then performs three misaligned LWs at offsets +1, +2, +3.
    The hardware merges the two aligned beats transparently; no exception is
    raised (CHERIoT-Ibex handles misaligned LW in hardware).  Returns 0 on
    success; 1-3=wrong merged value, 4-6=interrupt state (no exception expected).
  iterations: 1
  test_srcs: wb_lsu_misaligned/wb_lsu_misaligned.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests

- test: wb_counter_inhibit
  desc: >
    White-box mcountinhibit.CY gate on mcycle counter (ibex_cs_registers.sv).
    Verifies three states: (1) mcycle increments normally, (2) mcycle is frozen
    while mcountinhibit bit 0 = 1, (3) mcycle resumes after inhibit is cleared.
    CSR 0x320 = mcountinhibit; bit 1 is hardwired to 0 in ibex.  Returns 0 on
    success; 1=counter not running, 2=counter not stopped, 3=counter not resumed,
    4-6=interrupt state.
  iterations: 1
  test_srcs: wb_counter_inhibit/wb_counter_inhibit.S
  sim_opts: "+enable_cheriot_seq=1"
  config: cheriot-c-tests
