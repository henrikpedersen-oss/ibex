- test: cheriot_asr_counter_csr
  desc: >
    Counter CSRs must be readable while PCC lacks the access-system-registers
    permission. ext_check_CSR() in the CHERIoT Sail model admits reads of
    mcycle/minstret/mcycleh/minstreth and the unprivileged cycle/time/instret
    shadows without ASR, and requires ASR only for writes. ibex_decoder.sv's
    safe-list originally covered just 0xC00-0xC9F and omitted the four 0xB
    machine-mode counters, so "csrr rd, mcycle" from a compartment without ASR
    raised PermitAccessSystemRegistersViolation -- CHERIoT RTOS times every test
    with that instruction and hung in an endless violation loop. CAndPerm is
    monotone and the crt's exit path needs ASR, so the read is done inside a
    CJALR excursion whose backward sentry restores the ASR-bearing PCC on
    return. Tests: (1) the derived capability has SR clear; (2) it retains EX,
    so the excursion is genuinely executable; (3) mcycle advances rather than
    trapping while ASR is absent; (4) the excursion ran to completion; (5) ASR
    is restored afterwards.
  iterations: 1
  test_srcs: cheriot_asr_counter_csr/cheriot_asr_counter_csr.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

# ── TRVK revocation (REQ_TMP_01) ─────────────────────────────────────────────
# These need the revocation plusargs (ibex_revbm_pkg.sv). The CHERIoT-Sail cosim
# is given the same bitmap and checks every revoked CLC's tag on its own.
- test: cheriot_revoke_load_barrier
  desc: >
    Revoked arm of the TRVK load barrier. A CLC of a capability whose base is in
    a revoked granule returns tag 0, address and all other fields intact (bit
    select, unaligned base, base not cursor, first and last bitmap words); the
    neighbouring live granules keep the tag; bases out of TRVK's window (base 0,
    one past, one below, each aliasing a revoked bit) are never revoked; SE/US/U0
    capabilities are exempt but a sealed data capability is not; a bitmap
    device error revokes the whole word and raises alert_major_bus (TB
    assertions); back-to-back lookups each get their own verdict.
    Returns 0 on success, else 1-38.
  iterations: 1
  test_srcs: cheriot_revoke_load_barrier/cheriot_revoke_load_barrier.S
  sim_opts: >-
    +enable_cheriot_seq=1 +disable_spurious_dside_responses=1
    +revbm_mode=range +revbm_heap_base=80000000
    +revbm_revoke_list=80018000:40,80018080:8,8001fff8:8,80000000:8
    +revbm_err_list=80019000:100 +revbm_err_kind=dev
  config: cheriot-c-tests

- test: cheriot_revoke_load_barrier_intg
  desc: >
    cheriot_revoke_load_barrier with the error word answered with a flipped ECC
    bit instead of trvk_revbm_err_i (TRVK's integrity-error revocation path,
    cp_trvk_intg_error). Needs MemECC (SecureIbex=1); the responder stops the
    run at time 0 otherwise. Returns 0 on success, else 1-38.
  iterations: 1
  test_srcs: cheriot_revoke_load_barrier/cheriot_revoke_load_barrier.S
  sim_opts: >-
    +enable_cheriot_seq=1 +disable_spurious_dside_responses=1
    +revbm_mode=range +revbm_heap_base=80000000
    +revbm_revoke_list=80018000:40,80018080:8,8001fff8:8,80000000:8
    +revbm_err_list=80019000:100 +revbm_err_kind=intg
  config: cheriot-c-tests

- test: cheriot_revoke_load_barrier_rnd
  desc: >
    256 CLCs over bitmap words 0x180-0x187 against a per-seed random bitmap
    (50% revoked, 10% error words), with random bitmap-port backpressure and
    latency. The cosim checks each verdict; the program checks that a load is
    either identical or identical-but-untagged, that both outcomes occurred,
    that sealing capabilities over the same bases always keep the tag, and that
    bases just past the window are never revoked. Returns 0, else 1-8.
  iterations: 3
  test_srcs: cheriot_revoke_load_barrier_rnd/cheriot_revoke_load_barrier_rnd.S
  sim_opts: >-
    +enable_cheriot_seq=1 +disable_spurious_dside_responses=1
    +revbm_mode=random +revbm_revoke_pct=50 +revbm_heap_base=80000000
    +revbm_err_pct=10 +revbm_err_kind=dev
    +revbm_gnt_delay_max=3 +revbm_rsp_delay_max=3
  config: cheriot-c-tests

- test: cheriot_revoke_load_barrier_rnd_intg
  desc: >
    cheriot_revoke_load_barrier_rnd with 30% of the bitmap words answered with a flipped ECC bit
    (+revbm_err_kind=intg), so integrity errors arrive on words whose selected bit is set and
    clear (trvk_revoked_source_cross). Needs MemECC (SecureIbex=1). Returns 0, else 1-8.
  iterations: 3
  test_srcs: cheriot_revoke_load_barrier_rnd/cheriot_revoke_load_barrier_rnd.S
  sim_opts: >-
    +enable_cheriot_seq=1 +disable_spurious_dside_responses=1
    +revbm_mode=random +revbm_revoke_pct=50 +revbm_heap_base=80000000
    +revbm_err_pct=30 +revbm_err_kind=intg
    +revbm_gnt_delay_max=3 +revbm_rsp_delay_max=3
  config: cheriot-c-tests

- test: cheriot_revoke_load_barrier_rnd_both
  desc: >
    cheriot_revoke_load_barrier_rnd with 30% of the bitmap words answered with a device error
    and a flipped ECC bit on the same response (+revbm_err_kind=both; TRVK ORs them), with the
    selected bit set and clear (trvk_revoked_source_cross). Needs MemECC. Returns 0, else 1-8.
  iterations: 3
  test_srcs: cheriot_revoke_load_barrier_rnd/cheriot_revoke_load_barrier_rnd.S
  sim_opts: >-
    +enable_cheriot_seq=1 +disable_spurious_dside_responses=1
    +revbm_mode=random +revbm_revoke_pct=50 +revbm_heap_base=80000000
    +revbm_err_pct=30 +revbm_err_kind=both
    +revbm_gnt_delay_max=3 +revbm_rsp_delay_max=3
  config: cheriot-c-tests

# Expected to FAIL with 6 on the current RTL (static analysis; see the .S
# header): CHERIoT-Sail applies the load-global attenuation before the
# revocation check, the RTL gates it on the already-revoked tag.
- test: cheriot_revoke_attenuation
  desc: >
    A revoked capability loaded through an authority without LG: tag 0 and, per
    CHERIoT-Sail's LoadCapImm order, GL/LG cleared (perms 0x7C). Controls: the
    same attenuation on a live load, and no attenuation through a full
    authority. Returns 0 on success, else 1-7.
  iterations: 1
  test_srcs: cheriot_revoke_attenuation/cheriot_revoke_attenuation.S
  sim_opts: >-
    +enable_cheriot_seq=1 +disable_spurious_dside_responses=1
    +revbm_mode=range +revbm_heap_base=80000000
    +revbm_revoke_base=80018000 +revbm_revoke_size=8
  config: cheriot-c-tests

- test: csr_access_sweep
  desc: >
    Reads and writes every CSR counted by uarch_cg's cp_csr_read_only / cp_csr_write, from
    M-mode (write back the value read) and from U-mode (with mcounteren 0 and all-ones). Illegal
    accesses are skipped by the trap handler. Fills csr_read_only_priv_cross,
    csr_write_priv_cross and cp_csr_write. MSHWM/MSHWMB are swept from U-mode only (Ibex and
    Spike both trap); their M-mode accesses are left to CHERIoT tests.
  iterations: 1
  test_srcs: csr_access_sweep/csr_access_sweep.S
  config: riscv-tests

- test: pmp_fault_hazard
  desc: >
    Load/store accesses each followed by one instruction category (ALU/Mul/Div with and without a
    load hazard, branch, jalr through the loaded address, jal, load, store, CSR, fence, fence.i,
    ecall, ebreak, mret, wfi, compressed/uncompressed/CSR/privilege illegal, fetch error of a
    nop and of a load word, the latter FetchError with a Mem stall), in three passes: PMP
    fault (locked no-permission entry), bus error (d-side error window) and a
    completing access after which the instruction executes. Sweeps with icache off/on,
    data-independent timing, a masked pending timer interrupt and dcsr.ebreakm. The rtl_test
    raises debug requests at PMP faults, bus errors, ID stalls and after trap flushes, NMIs after
    trap flushes, fetch-enable drops, and the timer interrupt at the first wfi. Targets
    uarch_cg.exception_stall_instr_cross, stall_cross, pipe_cross, pipe_flush_instr_cross,
    debug_entry_if_instr_cross, interrupt_taken_instr_cross and irq_wfi_cross. Self-checking
    (fail codes in the test header), Spike cosim on.
  iterations: 4
  test_srcs: pmp_fault_hazard/pmp_fault_hazard.S
  config: riscv-tests
  # The riscv-tests config's 300 s expired on seeds 164/166 of regression 163 (2026-10-09) with the
  # sweep still running (debug handler entered 462 times); 13 of the earlier runs ended the same way.
  timeout_s: 1200
  rtl_test: core_ibex_stall_events_test
  sim_opts: "+disable_spurious_dside_responses=1 +dside_bus_err_lo=80100000 +dside_bus_err_hi=8010000f +dbg_req_on_write=80100100 +irq_timer_on_wfi=1 +dbg_on_pmp_err_pct=50 +dbg_on_dside_err_pct=50 +dbg_on_stall_pct=5 +dbg_after_flush_pct=30 +nmi_after_flush_pct=40 +fetch_off_on_stall_pct=5 +dbg_gap_min=10 +dbg_gap_max=60"
