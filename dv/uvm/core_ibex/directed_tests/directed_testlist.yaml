- test: cheriot_enable_transition
  desc: >
    cheriot_enable_i 0->1 while running (#827, REQ_BCK_05). Starts in RISC-V mode with the pin
    Off, checks arithmetic, a load/store round trip and that auipc returns an untagged result;
    writes to 0x80200000, after which the testbench raises the pin (+cheriot_enable_on_write);
    then checks auipc decodes as CAUIPCC and returns a tagged capability. Self-checking, cosim
    off: neither Spike nor CHERIoT-Sail models a pin that changes mid-run.
  iterations: 1
  test_srcs: cheriot_enable_transition/cheriot_enable_transition.S
  config: riscv-tests
  sim_opts: "+cheriot_enable_on_write=80200000 +disable_cosim=1 +disable_spurious_dside_responses=1"

- test: cheriot_enable_on_off
  desc: >
    cheriot_enable_i 0->1, then 1->0 while a CSC waits for the grant of its first word (REQ_BCK_06).
    As cheriot_enable_transition up to CHERIoT mode, plus a CSC/CLC round trip; then a write to
    0x80200010, after which the testbench slows the d-side grants, lowers the pin while the next CSC
    sits in LSU state CTX_WAIT_GNT1 (the LSU must hold the request until granted and complete the CSC), and
    requires alert_major_internal_o within 100 cycles (+cheriot_disable_on_write,
    core_ibex_base_test::watch_cheriot_disable_trigger). The 1->0 change breaks the pin contract of
    REQ_BCK_05 on purpose; the testbench turns CheriotEnableOneWaySwitch off for it. The program then
    continues in RISC-V mode without a trap. Cosim off: neither model has the pin.
  iterations: 1
  test_srcs: cheriot_enable_on_off/cheriot_enable_on_off.S
  config: riscv-tests
  sim_opts: >-
    +cheriot_enable_on_write=80200000 +cheriot_disable_on_write=80200010 +disable_cosim=1
    +disable_spurious_dside_responses=1

# Raises the pin the same way as cheriot_enable_transition rather than using
# cheriot-c-tests: CHERIoT-Sail (get_mtvec/get_xret_target, set_xret_target)
# does not trap on mtvec/mepc where the CHERIoT ISA text and the RTL do, so
# under +enable_cheriot_seq=1 its oracle would log errors on every probe, and
# no plusarg disables only that oracle. See the test header.
- test: cheriot_mtvec_mepc_access
  desc: >
    Legacy mtvec/mepc CSRs in CHERIoT mode (REQ_SCR_07), per the CHERIoT ISA
    document: csrr, csrw, csrrw, csrrs, csrrc, csrrwi, csrrsi, csrrci and
    csrrsi-with-0 on mtvec (0x305) and on mepc (0x341) each raise an illegal
    instruction (mcause 2) at that pc, leave rd and MTCC unchanged, and a
    write never redirects the trap vector. Boots in RISC-V mode, the bench
    raises cheriot_enable_i on the write to 0x80200000; cosim off (see the
    comment above). Returns 0 on success, else 1-8 or 10*probe + 1..5, 190-193.
  iterations: 1
  test_srcs: cheriot_mtvec_mepc_access/cheriot_mtvec_mepc_access.S
  config: riscv-tests
  sim_opts: "+cheriot_enable_on_write=80200000 +disable_cosim=1 +disable_spurious_dside_responses=1"

- test: cheriot_bck_nocheck
  desc: >
    cheriot_enable_i Off (REQ_BCK_02, Off half): on the CHERIoT-capable build
    with the pin never raised, lw/sw, lh/lhu/sh and lb/lbu/sb through integer
    base registers (la-derived, loaded from memory, lui-only, and 2 KiB past
    the target with a negative offset) complete with the right data and no
    trap, where in CHERIoT mode each would be a tag violation. cgettag and a
    funct3=3 load (CLC) are illegal instructions, showing the pin is Off.
    Spike cosim. Returns 0 on success, else 1-17 in the CORE_STATUS word.
  iterations: 1
  test_srcs: cheriot_bck_nocheck/cheriot_bck_nocheck.S
  config: riscv-tests
  sim_opts: "+disable_spurious_dside_responses=1"

