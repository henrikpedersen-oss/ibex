##########################################################

# This file is generated by gen_testlist.py script and largely copies
# the formatting of the testlist.yaml used by riscv-dv, but only specifies
# directed tests.
#
# - All paths are relative to THIS FILE.
# - Each 'test' can specify a config by name to re-use common configuration
# - If a test redefines a key already in the config, the test option takes priority.

##########################################################

# Why every CHERIoT test below carries +disable_spurious_dside_responses=1
# ------------------------------------------------------------------------
# core_ibex_vseq.sv's pre_body enables spurious d-side bus responses on a dice
# roll -- cfg.spurious_response_pct = 20 in core_ibex_env_cfg.sv -- and disables
# the tb_no_spurious_response assertion when it does. On such a seed the log
# contains "Enabling spurious responses for this test".
#
# A spurious response corrupts an in-flight load and the core CORRECTLY takes a
# load access fault. But crt_cheriot.S's trap_entry is still the unported RV32
# handler, so the handler itself faults and the test dies in a double-fault
# UVM_FATAL rather than reporting anything. wb_cheri_clc_csc passed at SEED=1 and
# died at SEED=21618 on nothing but that roll.
#
# These are directed functional tests of specific datapaths; tolerating a
# corrupted bus is not what any of them covers, so the stimulus is turned off
# rather than papered over. Bus-fault behaviour needs its own test that owns a
# working trap handler -- which is blocked on porting trap_entry to CHERIoT
# (capability save/restore via csc/clc, MEPCC instead of mepc, and a handle_trap
# that can return; the weak one in syscalls.c calls tohost_exit(1337)).
#
# NOTE: single sim_opts key per test -- YAML silently keeps the last duplicate,
# so append to the existing string rather than adding a second sim_opts line.

##########################################################

- config: riscv-tests
  ld_script: link.ld
  includes: .
  gcc_opts: -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles
            -I../../../vendor/riscv-test-env/
            -I../../../vendor/riscv-test-env/p/
            -I../../../vendor/riscv-tests/isa/macros/scalar/
  rtl_test: core_ibex_base_test
  rtl_params:
    PMPEnable: 1
  timeout_s: 300

- config: riscv-arch-tests
  ld_script: link.ld
  includes: .
  gcc_opts: -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles
            -I../../../vendor/riscv-arch-tests/riscv-test-suite/env/
            -I../../../vendor/riscv-isa-sim/arch_test_target/spike/
  rtl_test: core_ibex_base_test
  rtl_params:
    PMPEnable: 1
  timeout_s: 300

# -march=rv32im (no C): every mseccfg test's handle_trap() resumes at epc + 4, which
# is only correct for 4-byte instructions. Under -march=rv32imc GCC emits c.sw/c.lw for
# the target_arr accesses, so a data PMP fault resumed 2 bytes past the next instruction
# and decoded garbage -- the 24 match1 tests died on a bogus illegal instruction rather
# than on the PMP fault they assert. Dropping C keeps every faulting access 4 bytes wide.
#
# ePMP/mseccfg tests are plain RISC-V: they exercise mseccfg MML/MMWP, not CHERIoT.
# This config deliberately sets no sim_opts, so cfg.enable_cheriot_seq stays 0 and
# core_ibex_base_test leaves cheriot_enable at IbexMuBiOff. crt.S -- not crt_cheriot.S
# -- is therefore the correct startup file: crt_cheriot.S sets MTCC via cspecialr/
# csetaddr/cspecialw, and those CHERI opcodes are illegal while cheriot_enable is
# off, so MTCC would never be written and every trap would vector to 0x80000000.
- config: epmp-tests
  ld_script: ../../../../vendor/riscv-isa-sim/tests/mseccfg/mseccfg_test.ld
  includes: .
  gcc_opts: -march=rv32im -O2 -I . -I ./. -I ../softfloat -I ../riscv -fno-builtin-printf
            -fdata-sections -fno-section-anchors -DPRINTF_SUPPORTED=1
            ../../../vendor/riscv-isa-sim/tests/mseccfg/crt.S
            ../../../vendor/riscv-isa-sim/tests/mseccfg/syscalls.c
            -mcmodel=medany -static -nostdlib -nostartfiles -lm -lgcc
            -Wl,-M -Wl,-Map=link.log
  rtl_test: core_ibex_base_test
  rtl_params:
    PMPEnable: 1
  timeout_s: 300

# CHERIoT-aware C tests (capability SP init before _init).
# Uses crt_cheriot.S instead of crt.S. After computing the integer SP, it
# reads MTDC into c2 (cspecialr c2, mtdc) and points c2's cursor at the integer
# SP (csetaddr c2, c2, x2), so that _init's first c.cscsp store does not
# fault. Only meaningful with +enable_cheriot_seq=1 (see sim_opts below),
# which asserts cheriot_enable_i and brings up the CHERIoT-Sail cosim oracle
# alongside Spike -- see ibex_cosim_scoreboard.sv.
- config: cheriot-c-tests
  ld_script: ../../../../vendor/riscv-isa-sim/tests/mseccfg/mseccfg_test.ld
  includes: .
  gcc_opts: -march=rv32imc -O2 -fno-builtin -fno-stack-protector
            ../../../vendor/riscv-isa-sim/tests/mseccfg/crt_cheriot.S
            ../../../vendor/riscv-isa-sim/tests/mseccfg/syscalls.c
            -mcmodel=medany -static -nostdlib -nostartfiles -lgcc
  rtl_test: core_ibex_base_test
  rtl_params:
    PMPEnable: 1
  timeout_s: 300

# Custom directed tests

- test: cheriot_null_cap
  desc: >
    CHERIoT capability property checks adapted from
    cheri-c-tests/clang_purecap_null.c (CTSRD/Cambridge). Uses raw
    .word-encoded CHERIoT instructions (cgettag, cspecialr) compiled via the
    standard rv32imc toolchain. Checks: (1) an integer-zero register has
    capability tag = 0; (2) MTCC has tag = 1; (3) MTDC has tag = 1.
  iterations: 1
  test_srcs: cheriot_null_cap/cheriot_null_cap.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cap_perms
  desc: >
    CHERIoT capability permission checks inspired by
    cheri-c-tests/clang_purecap_init.c (CTSRD/Cambridge). Verifies that
    code capabilities have execute permission and data capabilities do not,
    using cgetperm on the reset values of MTCC (execution root, perms=0x1EB)
    and MTDC (memory data root, perms=0x07F). Tests: (1) MTCC tag=1;
    (2) MTCC permit_execute (bit 8) is set; (3) MTDC tag=1;
    (4) MTDC permit_execute (bit 8) is clear; (5) MTDC permit_load (bit 5)
    is set; (6) MTDC permit_store (bit 2) is set.
  iterations: 1
  test_srcs: cheriot_cap_perms/cheriot_cap_perms.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cap_base
  desc: >
    CHERIoT capability base address test. Verifies that MTCC, MTDC, and
    MScratchC all have base address = 0 at reset using CGetBase (funct7=0x7F,
    rs2=2, .word 0xFE25055B) -- an instruction not exercised by earlier
    tests. All three root capabilities cover the full 4 GB address space
    (base=0, length=2^32). Tests: (1) MTCC base=0; (2) MTDC base=0;
    (3) MScratchC base=0.
  iterations: 1
  test_srcs: cheriot_cap_base/cheriot_cap_base.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_mscratchc_seal
  desc: >
    MScratchC (SCR 30) resets to CPERMS_TS, the seal root capability, not a
    general-purpose scratch register. Checks expand_perms(CPERMS_TS) via
    cgetperm: GL(0)=1, US(9)=1, SE(10)=1, U0(11)=1, all else clear
    (in particular EX(8)=0 -- not executable). Tests: (1) tag=1;
    (2) permit_seal set; (3) permit_unseal set; (4) permit_execute clear;
    (5) global set.
  iterations: 1
  test_srcs: cheriot_mscratchc_seal/cheriot_mscratchc_seal.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cap_len
  desc: >
    CGetLen (funct7=0x7F, rs2=3) on the three reset root capabilities.
    MTCC/MTDC/MScratchC all cover the full 4GB address space at reset
    (base=0, top=2^32), which overflows a 32-bit register; cheriot_cap_length
    saturates to 0xFFFFFFFF when top33[32]=1. Tests: (1) MTCC length=
    0xFFFFFFFF; (2) MTDC length=0xFFFFFFFF; (3) MScratchC length=0xFFFFFFFF.
  iterations: 1
  test_srcs: cheriot_cap_len/cheriot_cap_len.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cap_type
  desc: >
    CGetType (funct7=0x7F, rs2=1) on the three reset root capabilities.
    All three are unsealed at reset, so CGetType must return 0
    (OTYPE_UNSEALED) for each. Tests: (1) MTCC type=0; (2) MTDC type=0;
    (3) MScratchC type=0.
  iterations: 1
  test_srcs: cheriot_cap_type/cheriot_cap_type.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cap_addr
  desc: >
    CGetAddr (funct7=0x7F, rs2=0x0F -- note: not 0x05) on the three reset
    root capabilities. At reset all three have base=0, so CGetAddr must
    return 0 for each. Tests: (1) MTCC addr=0; (2) MTDC addr=0;
    (3) MScratchC addr=0.
  iterations: 1
  test_srcs: cheriot_cap_addr/cheriot_cap_addr.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_intcap_arith
  desc: >
    Any integer ALU op writing a register clears its capability tag --
    the core CHERI guarantee that a capability cannot be forged by integer
    arithmetic. Exercises addi/add/sub/andi/ori/xori/slli/mul, checking
    cgettag=0 after each. Tests: (1) li/addi; (2) add; (3) sub; (4) andi;
    (5) ori; (6) xori; (7) slli; (8) mul.
  iterations: 1
  test_srcs: cheriot_intcap_arith/cheriot_intcap_arith.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_andperm
  desc: >
    CAndPerm (funct7=0x0D) narrows a capability's permission field without
    clearing the tag (unsealed capabilities: narrowing permissions is always
    safe/monotone). Applies mask=0xFF to MTCC (perms=0x1EB), clearing EX
    (bit 8) while preserving GL (bit 0). Tests: (1) tag still 1 after
    CAndPerm; (2) EX now clear; (3) GL still set.
  iterations: 1
  test_srcs: cheriot_andperm/cheriot_andperm.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_ccleartag
  desc: >
    CClearTag (funct7=0x7F, rs2=0x0B) clears the tag and nothing else
    (CHERIoT-Sail clearTag). On a copy of MTCC, whose cursor is trap_entry
    (installed by crt_cheriot.S): (1) tag=1 before; (7) address before is
    non-zero (precondition); (2) tag=0 after; (3) address after equals the
    address before; (4)-(6) no interrupt. Results in t0/s0 so ca0 keeps the
    capability. Returns 0 on success, else 1-7.
  iterations: 1
  test_srcs: cheriot_ccleartag/cheriot_ccleartag.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cinc_addr
  desc: >
    CIncAddr (funct7=0x11) adds an integer offset to a capability's cursor;
    the tag stays 1 as long as the new cursor is within [base, top). Applies
    +4 to MTCC (full 4GB range). Tests: (1) cursor now 4; (2) base
    unchanged (0); (3) tag still 1 (in-bounds).
  iterations: 1
  test_srcs: cheriot_cinc_addr/cheriot_cinc_addr.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_csetaddr
  desc: >
    CSetAddr (funct7=0x10) sets a capability's cursor to an absolute address
    from an integer register (vs CIncAddr's relative offset). Per
    CHERIoT-Sail setCapAddr the tag is cleared iff cs1 is sealed or the new
    address is unrepresentable (window [base, base + 2^(9+E))); MTCC is
    full-range, so it is kept here. On one MTCC copy, no re-derivation: (1)
    CSetAddr(0x1000) gives cursor 0x1000; (2) base still 0; (3) tag still 1;
    (4) a second CSetAddr(0) gives cursor 0; (5)-(7) no interrupt. Results
    in t0 so ca0 keeps the capability. Returns 0 on success, else 1-7.
  iterations: 1
  test_srcs: cheriot_csetaddr/cheriot_csetaddr.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_csub
  desc: >
    CSub (funct7=0x14) computes an integer cursor difference between two
    capability registers (cs1.cursor - cs2.cursor), the canonical CHERIoT
    pointer-difference idiom. Tests: (1) CSub(MTCC, MTCC)=0; (2)
    CSub(MTCC+16, MTCC)=16 after CIncAddr.
  iterations: 1
  test_srcs: cheriot_csub/cheriot_csub.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_setbounds
  desc: >
    CSetBounds (funct7=0x08) narrows a capability's bounds to
    [cursor, cursor+len). Tests: (1) CGetLen=256 after
    CSetBounds(MTDC,256); (2) CGetBase=0; (3) tag=1 (sub-region
    contained in original bounds); (4) CGetAddr (cursor) unchanged;
    (8-20) a tagged cs1 with its cursor above top (E = 2 at top+4, E = 24 at
    0x91000000) gives an untagged result for requests 1, 7 and 0, with Sail
    base/length; (21-24) the same with the E = 2 cursor at top and a request
    of 3; (25-27) the E = 24 cursor above top with a request of 7; (28-31)
    a sealed tagged E = 1 source with its cursor inside and a request of 0
    gives an untagged result (Sail clearTagIfSealed), base = cursor, length 0;
    (32-34) the E = 24 cursor above top with a request of 1; (35-42) a length-2
    E = 0 source with its cursor above top and requests 3 and 7 (longer than
    cs1): untagged, base = cursor, length = request (cheriot_csetbounds_cross1);
    (43-45) the same source with a request of 5; (46-49) the E = 2 cursor at
    top with a request of 2: untagged, base = cursor, length 2.
  iterations: 1
  test_srcs: cheriot_setbounds/cheriot_setbounds.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cap_readback
  desc: >
    Field-by-field CSC/CLC round-trip check: stores a capability (MTDC,
    then MTCC) to memory and reloads it, verifying tag/perm/base/len/
    addr/type are all preserved exactly, and that an integer store to
    the same slot clears the tag on reload (revocation); round trips of
    CSetBoundsExact caps at E = 1..14 (tag, length, base) and of
    otype-14 and otype-15 sealed data caps (otype fields 6 and 7;
    codes 20-83).
  iterations: 1
  test_srcs: cheriot_cap_readback/cheriot_cap_readback.S
  # NOTE: single sim_opts key only -- YAML silently keeps the last duplicate, so
  # a second `sim_opts:` here discards the first without warning.
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_pcc
  desc: >
    Program Counter Capability (PCC) properties via AUIPCC (opcode=0x17,
    decoded as CAUIPCC under cheriot_enable_i). Tests: (1) PCC tag=1;
    (2) PCC has execute permission (EX, bit 8); (3) PCC has global
    permission (GL, bit 0).
  iterations: 1
  test_srcs: cheriot_pcc/cheriot_pcc.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cincaddrimm
  desc: >
    CIncAddrImm (funct3=001), the immediate-operand sibling of CIncAddr.
    Tests: (1) CGetAddr after +4 immediate increment; (2) base unchanged;
    (3) tag preserved (in-bounds increment on MTCC).
  iterations: 1
  test_srcs: cheriot_cincaddrimm/cheriot_cincaddrimm.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_setboundsimm
  desc: >
    CSetBoundsImm (funct3=010), the immediate-operand sibling of
    CSetBounds. Tests: (1) CGetLen=256 after CSetBoundsImm(MTDC,256);
    (2) CGetBase=0; (3) tag=1; (4) CGetAddr (cursor) unchanged.
  iterations: 1
  test_srcs: cheriot_setboundsimm/cheriot_setboundsimm.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_setboundsexact
  desc: >
    CSetBoundsExact (funct7=0x09) clears the tag instead of rounding up
    when the requested bounds aren't exactly representable. Tests:
    (1)-(2) len=256 (exact) succeeds with tag=1, CGetLen=256;
    (3) len=300 (not exactly representable) clears the tag.
  iterations: 1
  test_srcs: cheriot_setboundsexact/cheriot_setboundsexact.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_setboundsrndn
  desc: >
    CSetBoundsRoundDown (funct7=0x0a) rounds the requested length DOWN
    (result subset of request) instead of UP like plain CSetBounds
    (result superset of request). Tests: (1) length <= requested;
    (2) base unchanged; (3) tag=1; (4) round-down length strictly less
    than plain CSetBounds's round-up length for the same non-power-of-two
    request, proving the two take genuinely different datapaths.
  iterations: 1
  test_srcs: cheriot_setboundsrndn/cheriot_setboundsrndn.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cap_high
  desc: >
    CGetHigh/CSetHigh (funct7=0x7f rs2=0x17 / funct7=0x16) round-trip a
    capability's packed non-address metadata through the CHERIoT memory
    representation. Tests: (1) tag is always cleared by CSetHigh (it can
    never mint a valid capability); (2)-(5) perm/base/len/otype
    round-trip correctly; (6) address is taken from cs1's cursor, not the
    "high" word.
  iterations: 1
  test_srcs: cheriot_cap_high/cheriot_cap_high.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cseal_cunseal
  desc: >
    CSeal/CUnseal (funct7=0x0b/0x0c) round-trip an executable capability
    (MTCC) through a sentry seal using MScratchC (ROOT_CAP_TS, the
    dedicated sealing root with SE/US permission) as the sealing
    authority. Tests: (1)-(2) CSeal succeeds (tag=1, otype=1=
    OTYPE_SENTRY_II_FWD); (3) original cs1 untouched; (4)-(5) CUnseal
    succeeds (tag=1, otype=0); (6) permissions preserved round-trip;
    (10-24) CUnseal with an untagged, sealed, local data authority gives an
    untagged, unsealed, non-global result for an integer, untagged sealed
    local/global and tagged unsealed cs1; (25-52) CUnseal of an unsealed
    cs1 with a tagged sealed authority (US 0 or 1), an untagged sealed one
    with US = 1, and an untagged sealed global one: cd untagged, unsealed,
    GL = cs1.GL & cs2.GL; (53-54) CSeal of MTCC with an untagged sealing
    authority whose address is its base gives an untagged result; (55-58)
    CUnseal of a tagged unsealed global cs1 with a tagged sealed authority
    without US and GL: cd untagged, unsealed, GL 0; (59-61) CSeal of MTCC
    with an untagged SE authority at address 13 inside its bounds, and with a
    tagged non-SE authority whose address 4 is above its top: cd untagged;
    (62-68) CUnseal of an untagged and a tagged unsealed global cs1 with an
    untagged sealed authority with US and without GL: cd untagged, unsealed,
    GL 0.
  iterations: 1
  test_srcs: cheriot_cseal_cunseal/cheriot_cseal_cunseal.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_cjalr_sentry
  desc: >
    CJALR compartment call/return through a real interrupt-toggling
    sentry (OTYPE_SENTRY_IE_FWD), not just the implicit unsealed-jump
    path exercised by crt boot code elsewhere. Tests: (1) mstatus.MIE
    set on entry; (2) CJALR mints a real tagged backward sentry in ra;
    (3) mstatus.MIE restored to its pre-call value on return via that
    sentry; (4) the callee actually executed.
  iterations: 1
  test_srcs: cheriot_cjalr_sentry/cheriot_cjalr_sentry.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

# ── CHERIoT temporal safety ──────────────────────────────────────────────────
# cheriot_revoke_basic covers tag clearing by integer stores and the fault on a
# stale pointer. It runs with +revbm_mode=off (every lookup answered "live"); the
# revoked verdict is covered by cheriot_revoke_load_barrier* further down.
- test: cheriot_revoke_basic
  desc: >
    Integer stores revoke, stale pointers fault. CSC MTCC then CLC gives
    tag=1 (also the TRVK not-revoked path); SW to the low word, SW to the high
    word, SH and SB each clear the granule's tag; CSC of an untagged register
    clears it too; a store to the neighbouring granule leaves this one tagged.
    Then a scrubbed pointer is reloaded (tag=0, address intact) and an LW
    through it must trap: mcause=28, mtval=0x1A2 (tag violation on c13),
    MEPCC at the LW. Uses a test-local MTCC vector as juliet_cwe131_fault does.
    Returns 0 on success, else the number of the failing check (1-18).
  iterations: 1
  test_srcs: cheriot_revoke_basic/cheriot_revoke_basic.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

# ── CHERIoT RTOS-pattern capability tests ────────────────────────────────────
# Instructions the CHERIoT RTOS relies on, exercised the way the RTOS uses them
# (allocator sizing, check_pointer, capability spills). Expected values are
# taken from the CHERIoT Sail model.
- test: cheriot_rtos_clc_csc
  desc: >
    Capabilities survive a trip through memory. MTCC and a bounded,
    permission-reduced object capability each come back from CSC/CLC tagged
    and CSetEqualExact to the original (base and length also checked). An SW
    to one slot clears its tag, the reloaded value carries the stored integer,
    and the other slot stays tagged. Returns 0 on success, else 1-12.
  iterations: 1
  test_srcs: cheriot_rtos_clc_csc/cheriot_rtos_clc_csc.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_rtos_cmove
  desc: >
    CMove copies every field. From a non-root source (bounded to
    [0x80001230,+64), cursor +8, perms reduced) the copy keeps tag, perms,
    base, length and address and is CSetEqualExact to the source; an untagged
    source gives an untagged copy; a copy of MTCC keeps perms 0x1EB.
    Returns 0 on success, else 1-12.
  iterations: 1
  test_srcs: cheriot_rtos_cmove/cheriot_rtos_cmove.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_rtos_crrl
  desc: >
    CRRL and CRAM against the Sail model for lengths 16, 511, 512, 513, 1023
    (exponent bump), 0x12345, 0x400000 (largest unsaturated exponent),
    0x800001 (exponent saturates to 24), 0xFFFFFFFF (CRRL wraps to 0) and 0.
    CRAM is all ones when no alignment is needed. Then the allocator recipe:
    CSetBoundsExact on base & CRAM with length CRRL keeps the tag and gives the
    expected bounds, and the unaligned base does not. Returns 0 on success,
    else 1-27.
  iterations: 1
  test_srcs: cheriot_rtos_crrl/cheriot_rtos_crrl.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_rtos_gettop
  desc: >
    CGetTop returns the decoded top, saturated: 0xFFFFFFFF for full range
    (not 0), 512 and 1024 for [0,512) and [0,1024), 0x80001100 for a
    non-zero base, unchanged after a cursor move and after CClearTag, and
    0x80001202 when length 513 is rounded up. Returns 0 on success, else 1-10.
  iterations: 1
  test_srcs: cheriot_rtos_gettop/cheriot_rtos_gettop.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_rtos_isequal
  desc: >
    CSetEqualExact compares every field. Equal: a CMove copy, the same
    register twice, and a no-op CAndPerm(0xFFF). Not equal, each differing in
    one field only: permissions, address, tag, bounds; plus MTCC against MTDC.
    Returns 0 on success, else 1-11.
  iterations: 1
  test_srcs: cheriot_rtos_isequal/cheriot_rtos_isequal.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_rtos_subset
  desc: >
    CTestSubset rd, cs1, cs2 is "cs2 subset of cs1" (Sail operand order).
    Checks the order itself, the top, base and permission comparisons, a
    strict interior subset of a bounded capability, self-subset, a tag
    mismatch (0) and two untagged operands (1). Returns 0 on success, else
    1-12.
  iterations: 1
  test_srcs: cheriot_rtos_subset/cheriot_rtos_subset.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_perm_lc_sc
  desc: >
    CLC and CSC through an authority without MC (Permit_Load_Store_Capability,
    CHERIoT's single load/store-capability permission; perms 0x25 GL SD LD).
    CLC of a global and a local capability returns each with tag 0 and every
    other field intact (address, perms, CSetEqualExact to CClearTag of the
    original), with no exception. CSC of an untagged value succeeds and
    writes it untagged. CSC of a tagged capability traps: mcause 28, mtval
    0x175 (capcause 0x15 against c11), MEPCC at the CSC, target slot still
    holds its old tagged value. Controls through the MTDC authority (0x7F)
    keep the tag. Returns 0 on success, else 1-34.
  iterations: 1
  test_srcs: cheriot_perm_lc_sc/cheriot_perm_lc_sc.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_seal_fail
  desc: >
    Sealing failure arms and sealed-capability immutability (REQ_SEL_01-04),
    expected values from CHERIoT-Sail. CSeal gives tag 0, no trap, for an
    untagged, sealed or SE-less cs2, cs2.address = cs2.top, a sealed cs1, and
    an otype outside 1-7 (executable cs1) or 9-15 (data cs1), including values
    whose low bits are legal; controls at otypes 1, 7, 9, 15 and the last
    in-bounds address. CUnseal gives tag 0 for an untagged, sealed or US-less
    cs2, an unsealed cs1, and an otype below base or at top; cs2.address is not
    compared; GL = cs1.GL & cs2.GL. CIncAddr, CIncAddrImm, CSetAddr,
    CSetBounds(Exact/Imm/RoundDown), AUICGP and CAndPerm on a sealed cap clear
    the tag (CAndPerm keeps it for mask 0xFFF or only GL cleared), each with an
    unsealed control. lw, sw, CLC and CSC through a data-sealed cap and a
    sentry trap with capcause 0x03 against the authority, nothing written.
    Returns 0 on success, else 1-136.
  iterations: 1
  test_srcs: cheriot_seal_fail/cheriot_seal_fail.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_scr_faults
  desc: >
    System-register access without PCC.SR (REQ_PER_06, REQ_SCR_01,
    REQ_EXC_04), expected values from CHERIoT-Sail. Runs from a PCC derived
    with CAndPerm(MTCC, 0xF7F) and recovers through a test-local MTCC. Reads
    of mcycle, minstret, mcycleh, minstreth (and csrrsi/csrrci with uimm 0)
    are permitted; csrr mstatus, csrw mscratch, csrw mcycle, csrrs with rs1 !=
    x0 and MRET give capcause 0x18 against PCC (mtval 0x418), with no side
    effect; CSpecialRW on MTCC/MTDC/MScratchC/MEPCC gives 0x18 with mtval[10:5]
    = 0x20 + scr (0x798, 0x7B8, 0x7D8, 0x7F8) and writes neither cd nor the
    SCR. SCRs 1, 24 and 27, an undefined CSR and a write to mhartid are
    illegal instructions (mcause 2) ahead of the SR check. Returns 0 on
    success, else 1-87.
  iterations: 1
  test_srcs: cheriot_scr_faults/cheriot_scr_faults.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: cheriot_fetch_bounds
  desc: >
    PCC bounds at instruction fetch (REQ_BND_03/07, REQ_BRA_05/08,
    REQ_CFI_05). Enters small exact CSetBoundsExact execute regions and
    expects each fetch outside [base, top) to trap with mcause 28, mtval
    0x401 (Bounds Violation against PCC), MEPCC.address = the faulting fetch
    PC and MEPCC.tag = 0, with the out-of-bounds instruction not executed:
    sequential fetch reaching Top; a 32-bit instruction whose second
    half-word is past Top (both alignments, mepc = the instruction, not +2);
    a 16-bit instruction ending exactly at Top executes (both alignments); a
    taken BEQ past Top and a CJAL below Base retire and fault at the target;
    CJALR to a capability whose address is its Top, and CJALR with imm -4 to
    below Base, retire and fault at the target; MRET to a tagged MEPCC whose
    address is its Top. Section 11 runs one taken branch per reachable
    cp_cheri_branch_bound value (gen_branch_bounds.py): targets below, at, inside,
    1..7 bytes under, at and above the top of exact small regions, and against PCC
    [0x81000000, 2^32) and [0, 0x81000000) with code copied there; in-bounds
    targets must run, the others fault at the target.
    Section 12 (needs +far_code_windows=1) copies code to 0 and to 2^32 - 32
    and runs the same checks for taken branches and CJALs to targets 2..6 bytes
    under a top of 2^32, at a base of 0, 1..7 bytes under an odd top over a
    base of 0 and at 0 / 2^32 - 2..6 under the root PCC (CJAL also at the base
    of [0x81000000, 2^32), below it, at, above and 2..6 under the top of
    [0, 0x81000000), under section 11's PCCs of length 2..7 and 7 bytes under
    the top of a length-9 one and 2 bytes under the top of a length-8 one,
    cp_cheri_cjal_bound 0x070 and 0x020), checking
    the CJAL link; and AUIPCC from PCCs at both ends whose result wraps past
    2^32 or 0, checking the address and the cleared tag. Section 13 is
    section 10's MRET with an untagged MEPCC: the fetch at Top violates the
    tag and the bounds, and must report the tag (mtval 0x402). Returns 0 on
    success, else a section-coded failure.
  iterations: 1
  test_srcs: cheriot_fetch_bounds/cheriot_fetch_bounds.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1 +far_code_windows=1"
  config: cheriot-c-tests

- test: cheriot_cjalr_faults
  desc: >
    CJALR exception causes and priority (REQ_CFI_01/03, REQ_PER_03,
    REQ_SEL_06/08), expected values from CHERIoT-Sail CJALR. Untagged cs1
    gives capcause 0x02 against cs1, before seal and EX (also via c.jr);
    data-sealed (otype 9, 15) and executable non-sentry (6, 7) cs1 give
    0x03, before EX; tagged unsealed cs1 without EX gives 0x11 (also via
    c.jalr). Sentry/register-pair rules: backward sentry for a call or tail
    call, forward sentry otype 2 with cd = ct1, forward sentry or unsealed
    cap as a return (cd = c0, cs1 = cra), and a sealed cs1 with imm != 0 all
    give 0x03. mtval[9:5] = cs1, MEPCC at the CJALR and tagged, cd not
    written. Controls: otype 1 sentry with cd = ct1 or c0 and an unsealed
    cap with imm 4 jump. REQ_PER_03: an MTCC written without EX reads back
    untagged (restored at once; trapping through it would livelock), and
    MRET through an EX-less MEPCC faults at the fetch with 0x02 against PCC
    (mtval 0x402). Returns 0 on success, else a section-coded failure.
  iterations: 1
  test_srcs: cheriot_cjalr_faults/cheriot_cjalr_faults.S
  sim_opts: "+enable_cheriot_seq=1 +disable_spurious_dside_responses=1"
  config: cheriot-c-tests

- test: empty
  desc: >
    Empty directed test
  iterations: 1
  test_srcs: empty/empty.S
  config: riscv-tests

- test: mcounteren_test
  desc: >
    Tests the mcounteren CSR: reset value, hardwired-zero bit 1 (time),
    and U-mode counter access gating.
  iterations: 1
  test_srcs: mcounteren_test/mcounteren_test.S
  config: riscv-tests

- test: mcounteren_lock_test
  desc: >
    Tests that mcounteren retains its value after mcounteren_writable_i is
    de-asserted mid-simulation (write-lock).
  iterations: 1
  rtl_test: core_ibex_mcounteren_lock_test
  test_srcs: mcounteren_test/mcounteren_lock_test.S
  config: riscv-tests

- test: zcmp_reserved_test
  desc: >
    Reserved Zcmp encodings trap as illegal instructions and are not
    expanded. Cosim mismatches are not fatal because the cosim does not
    enable Zcmp.
  iterations: 1
  test_srcs: zcmp_reserved_test/zcmp_reserved_test.S
  config: riscv-tests
  rtl_params:
    PMPEnable: 1
    RV32ZC: ["ibex_pkg::RV32ZcaZcmp", "ibex_pkg::RV32ZcaZcbZcmp"]
  sim_opts: +disable_cosim=1

