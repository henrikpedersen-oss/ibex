#
# Functional coverage closure: directed tests for covergroup bins (core_ibex_fcov_if.sv,
# core_ibex_pmp_fcov_if.sv) that the full UVM regression left unhit, or hit only on some random
# seeds (2026-10). Each test header names the bins it targets and where its expected values come
# from. Bins that an existing targeted test should reach were added to that test instead
# (cheriot_csethigh, cheriot_cseal_cunseal, cheriot_setbounds, cheriot_cap_readback).
#
# Configs are shared across all directed_testlist*.yaml files (directed_test_schema.py):
# riscv-tests is defined in directed_testlist.yaml, cheriot-dv-tests in
# directed_testlist_cheriot_traps.yaml. Both tests here run in RISC-V mode with the Spike cosim
# on. +disable_spurious_dside_responses=1 for the reason given at the top of
# directed_testlist.yaml.

- test: cov_fcov_debug_tdata_read
  desc: >
    Read-only accesses to tselect, tdata1 and tdata2 in debug mode (one haltreq session):
    tselect 0, tdata1 0x28001048 (type 2, dmode, action = enter debug mode, m, u, execute 0),
    tdata2 0, then 0x5A5AA5A4 after a debug-mode write, then 0 again; tdata2 0 after dret.
    Targets uarch_cg.csr_read_only_debug_cross {TDATA1, TDATA2} x debug mode, which riscv-dv's
    debug ROM never reads. Expected values from ibex_cs_registers.sv gen_trigger_regs (Debug
    Spec 0.13.2 5.2); Spike cosim on. Returns 0 on success; codes in the test header.
  iterations: 1
  test_srcs: cov_fcov_debug_tdata_read/cov_fcov_debug_tdata_read.S
  config: cheriot-dv-tests
  rtl_test: core_ibex_single_debug_pulse_test
  sim_opts: "+disable_spurious_dside_responses=1 +require_signature_addr=1 +enable_debug_seq=1"

- test: cov_fcov_pmp_mml_locked_wr
  desc: >
    mseccfg.MML = 1, RLB = 0: PMP entries 4-7 locked as MML_L, MML_RM, MML_WRM and MML_RM_RU
    (A = OFF), region 0 a locked M-mode RX rule over the program. Seven writes of pmpcfg1, one
    per executable MML configuration (XU, XRU, XWRU, XM_XU, XM, XRM, XRM_XU in every byte), are
    all ignored: pmpcfg1 reads back unchanged after each (Privileged Spec 3.7.1 lock, Smepmp).
    Fills every rlb = 0 bin of pmp_region_cg.pmp_wr_exec_region from a locked source, which the
    riscv_epmp_* random tests reach only on some seeds. Spike cosim on. TEST_PASS / TEST_FAIL
    with the failing check's code in TESTNUM (gp): 1-4 setup, 10-16 a write took effect,
    0x100|code unexpected trap.
  iterations: 1
  test_srcs: cov_fcov_pmp_mml_locked_wr/cov_fcov_pmp_mml_locked_wr.S
  config: riscv-tests
  sim_opts: "+disable_spurious_dside_responses=1"

# pmp_region_cg is per instance (one instance per PMP region), so each region must close on its
# own: the seven cov_fcov_pmp_region_* tests cover every legal bin of every region by
# construction (bin inventory and derivations in the test headers and in
# cov_fcov_pmp_region/pmp_region_sweep.h and pmp_region_wr_exec.h). They need the 16-region,
# granularity-0 PMP of the "opentitan" config (16 probe chunks of 8 bytes, NA4 selectable).

- test: cov_fcov_pmp_region_mml0
  desc: >
    mseccfg.MML = 0, RLB = 1: every PMP entry 0..15 as the highest-priority match on its own
    8-byte chunk below _start, for each of the 12 non-MML permission values (A field rotating
    TOR, NA4, NAPOT), with an M- and a U-mode fetch and an M- and a U-mode (mstatus.MPRV) load
    and store per entry: 1152 accesses, each checked as allowed (mcause 11/8, load data) or
    access-faulting (mcause 1/5/7, mtval, mepc) against Privileged Spec 3.7.1. Also NAPOT
    pmpaddr = 2^k - 1, k = 0..31, and a legalised (W without R) pmpcfg write, on every
    entry. Targets pmp_region_cg per instance: cp_napot_addr_modes, cp_warl_check_pmpcfg, cp_region_mode, the
    non-MML cp_region_priv_bits values, the iside/iside2/dside mode and priv-bits crosses, and
    cp_edit_locked_pmpcfg/pmpaddr. About 46000 instructions. Spike cosim on. TEST_FAIL code in
    gp (test header).
  iterations: 1
  test_srcs: cov_fcov_pmp_region/cov_fcov_pmp_region_mml0.S
  config: riscv-tests
  rtl_params:
    PMPEnable: 1
    PMPNumRegions: 16
    PMPGranularity: 0
  timeout_s: 2400
  sim_opts: "+disable_spurious_dside_responses=1"

- test: cov_fcov_pmp_region_mml1
  desc: >
    mseccfg.MML = 1, RLB = 1, MMWP = 0: as cov_fcov_pmp_region_mml0 for the 16 MML permission
    values (Smepmp 1.0 Table 2), 1536 accesses each checked. The program runs from a locked
    M-mode read/execute rule, NAPOT in entry 15 while entries 0..14 are probed, then TOR in
    entry 1 while entry 15 is probed. Targets pmp_region_cg per instance: the MML
    cp_region_priv_bits values and the MML rows of the iside/iside2/dside priv-bits crosses,
    plus the mode crosses again. About 58000 instructions. Spike cosim on. TEST_FAIL code in gp
    (test header).
  iterations: 1
  test_srcs: cov_fcov_pmp_region/cov_fcov_pmp_region_mml1.S
  config: riscv-tests
  rtl_params:
    PMPEnable: 1
    PMPNumRegions: 16
    PMPGranularity: 0
  timeout_s: 2400
  sim_opts: "+disable_spurious_dside_responses=1"

- test: cov_fcov_pmp_region_wr_exec_c0
  desc: >
    mseccfg.MML = 1, code rule (locked M-mode read/execute) in PMP entry 0, every other entry
    A = OFF. pmpcfg writes of each executable MML value (XU, XRU, XWRU, XM_XU, XM, XRM, XRM_XU)
    over each non-executable MML value: with RLB = 1 from all 9 (every write takes effect), with
    RLB = 0 from the 5 unlocked ones (the locked executable targets are ignored, Smepmp 2.3) and
    from this variant's locked value per entry (all ignored); every pmpcfg read back. Targets
    pmp_region_cg.pmp_wr_exec_region per instance; variants c0..c4 together give every entry
    all four locked values with RLB = 0 (header of cov_fcov_pmp_region/pmp_region_wr_exec.h).
    About 10000 instructions. Spike cosim on. TEST_FAIL code in gp.
  iterations: 1
  test_srcs: cov_fcov_pmp_region/cov_fcov_pmp_region_wr_exec_c0.S
  config: riscv-tests
  rtl_params:
    PMPEnable: 1
    PMPNumRegions: 16
    PMPGranularity: 0
  timeout_s: 900
  sim_opts: "+disable_spurious_dside_responses=1"

