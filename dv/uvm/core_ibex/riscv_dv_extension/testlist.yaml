- test: riscv_mmu_stress_test
  description: >
    Test with different patterns of load/store instructions, stress test MMU
    operations.
  iterations: 10
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=5
    +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40
    +directed_instr_2=riscv_multi_page_load_store_instr_stream,40
    +directed_instr_3=riscv_load_store_rand_addr_instr_stream,40
  rtl_test: core_ibex_base_test
  sim_opts: >
    +enable_bad_intg_on_uninit_access=0
  # Seed 167 of regression 163 (2026-10-09, nyx loaded) was still retiring instructions when the
  # 1800 s default expired (sim time 70 ms, 351k trace lines); the other 9 seeds passed under it.
  timeout_s: 3600

- test: riscv_illegal_instr_test
  description: >
    Illegal instruction test, verify the processor can detect illegal
    instruction and handle corresponding exception properly. An exception
    handling routine is designed to resume execution after illegal
    instruction exception.
  iterations: 15
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +illegal_instr_ratio=25
  rtl_test: core_ibex_base_test
  # Added 2026-09-24. Without this, seeds 21573/21574/21577/21578 failed
  # NoAlertsTriggered in the regression.
  #
  # core_ibex_base_test.sv:207 turns bad-integrity-on-uninitialised-access ON by
  # default, and ibex_mem_intf_response_seq_lib.sv:156 then inverts the SECDED
  # bits on any d-side read of a word the memory model has never seen written.
  # That raises lsu_load_resp_intg_err -> alert_major_bus_o
  # (ibex_core.sv:1356), which is a real alert from a real injected fault --
  # not an RTL defect.
  #
  # This test is *designed* to corrupt architectural state: with
  # illegal_instr_ratio=25 the stream clobbers base registers, so loads go to
  # wild addresses (a2=0, sp=0x9e) that were never written. Eleven sibling
  # tests already disable the injection for the same reason; this entry simply
  # had no sim_opts stanza at all.
  sim_opts: >
    +enable_bad_intg_on_uninit_access=0

