- test: riscv_arithmetic_basic_test
  description: >
    Arithmetic instruction test, no load/store/branch instructions
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=0
    +no_fence=1
    +no_data_page=1
    +no_branch_jump=1
    +boot_mode=m
  iterations: 10
  gen_test: riscv_instr_base_test
  rtl_test: core_ibex_base_test

- test: riscv_machine_mode_rand_test
  description: >
    Machine mode random instruction test
  iterations: 10
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=5
    +boot_mode=m
  rtl_test: core_ibex_base_test

- test: riscv_rand_instr_test
  description: >
    Random instruction stress test
  iterations: 10
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=5
    +gen_all_csrs_by_default=1
    +add_csr_write=MSTATUS,MEPC,MCAUSE,MTVAL,0x7c0,0x7c1
    +no_csr_instr=0
  rtl_test: core_ibex_base_test

# DISABLED 2026-09-24 — this test aborted the whole nyx regression.
#
# riscv-dv's generator exited zero but wrote no test_0.S for some seeds
# (seed 23043 failed; 12042-12044 succeeded), so the randomisation has no
# solution on some seeds without raising UVM_FATAL. run_instr_gen.py then
# raises "Generation commands exited with zero status but left no test_0.S",
# and because the inner make runs with -j that one failure takes the entire
# regression down with it (make[1]: *** [Makefile:72: run] Error 2). No test
# was assembled or simulated in that run.
#
# Re-enable only after the generator produces a program on every seed --
# suspect the ibex_cheriot_instr_gen_config role-register constraints
# ([RA:A5]) being unsatisfiable in combination with reserved_regs for some
# seeds. Test it standalone with several seeds before it goes back in a
# regression.
#
# Second blocker (2026-10-01): even when it generates, the program is not
# CHERIoT-correct outside the random stream. riscv-dv's trap handler saves
# registers with sw through an integer kernel stack pointer, sets mtvec/mepc
# with csrw (illegal with the pin On), signs off through li'd integer addresses,
# and its callstack jumps are `la` + jalr (CJALR on an untagged register), so
# the first trap or jump faults and the handler faults in turn. Interrupt,
# debug and memory-error coverage in CHERIoT mode therefore comes from the
# directed tests in directed_tests/directed_testlist_cheriot_traps.yaml.
# The random CHERI stream itself is now seeded: ibex_cheriot_instr_sequence
# prepends ibex_cheriot_cap_seed_stream (MTDC/MScratchC/AUIPCC-derived bounded,
# sealed and sealing capabilities) and +directed_instr_1 below re-seeds.
# - test: riscv_cheriot_rand_instr_test
#   description: >
#     Random instruction stress test confined to the 16 registers CHERIoT allows.
#     ibex_decoder.sv's illegal_reg_16 makes any access to x16-x31 an illegal
#     instruction once cheriot_enable_i is asserted -- it checks rf_ren_a/rf_ren_b/
#     rs3 and rd, so plain loads and stores trap too, not only capability opcodes.
#     Stock riscv-dv roams all 32 registers and cannot run in CHERIoT mode at all,
#     so this test needs both overrides below, not just one:
#       +instr_seq             pins the three instruction streams (main, stack
#                              enter, stack exit) and, via a factory override
#                              registered in its constructor, the callstack jumps
#                              -- riscv_jump_instr picks from its own `gpr` field
#                              and ignores avail_regs.
#       +uvm_set_type_override pins the register *roles*. sp/tp/ra/scratch_reg/
#                              gpr[]/pmp_reg[] are all rand in riscv_instr_gen_config
#                              with no upper bound; left alone they drew sp=s6 (x22)
#                              and ra=t5 (x30), so every prologue emitted
#                              "addi s6, s6, -12" however tightly the streams were
#                              constrained. It must be a plusarg rather than code:
#                              riscv_instr_base_test creates cfg in its build_phase
#                              (riscv_instr_base_test.sv:43), before any object here
#                              exists.
#     See riscv_dv_extension/ibex_cheriot_instr_sequence.sv for the full reasoning.

#     +march adds RV32X, the custom group carrying the 26 CHERIoT instructions
#     defined in vendor/google_riscv-dv/src/isa/custom/ (vendor patch 0006). It is
#     set per test rather than in riscv_core_setting.tpl.sv so no other random test
#     starts emitting capability instructions -- riscv_instr_gen_config.sv:633-634
#     lets +march replace supported_isa outright. Those instructions are emitted as
#     raw `.word` encodings because the toolchain is stock rv32imc and cannot
#     assemble CHERIoT mnemonics; the trapping ones (clc/csc/cjalr/cspecialrw) are
#     deliberately excluded, see rv32x_instr.sv.
#   iterations: 10
#   gen_test: riscv_instr_base_test
#   gen_opts: >
#     +instr_cnt=10000
#     +num_of_sub_program=5
#     +instr_seq=ibex_cheriot_instr_sequence
#     +uvm_set_type_override=riscv_instr_gen_config,ibex_cheriot_instr_gen_config
#     +directed_instr_0=ibex_cheriot_asr_stream,8
#     +directed_instr_1=ibex_cheriot_cap_seed_stream,20
#     +no_csr_instr=0
#     +march=RV32I,RV32M,RV32C,RV32X
#   rtl_test: core_ibex_base_test
#   sim_opts: >
#     +enable_cheriot_seq=1
#     +disable_spurious_dside_responses=1

