# ASAP7 7 nm predictive PDK, asap7sc7p5t regular-Vt cells (lib/README.md). Format: lib/nangate45.cfg.
# Five files per corner, merged into one liberty in lib/generated/ (scripts/prepare_liberty.py).

name=asap7
title=ASAP7 asap7sc7p5t RVT

typical=asap7/asap7sc7p5t_AO_RVT_TT_nldm_211120.lib.gz asap7/asap7sc7p5t_INVBUF_RVT_TT_nldm_220122.lib.gz asap7/asap7sc7p5t_OA_RVT_TT_nldm_211120.lib.gz asap7/asap7sc7p5t_SEQ_RVT_TT_nldm_220123.lib asap7/asap7sc7p5t_SIMPLE_RVT_TT_nldm_211120.lib.gz
slow=asap7/asap7sc7p5t_AO_RVT_SS_nldm_211120.lib.gz asap7/asap7sc7p5t_INVBUF_RVT_SS_nldm_220122.lib.gz asap7/asap7sc7p5t_OA_RVT_SS_nldm_211120.lib.gz asap7/asap7sc7p5t_SEQ_RVT_SS_nldm_220123.lib asap7/asap7sc7p5t_SIMPLE_RVT_SS_nldm_211120.lib.gz

# Times in ps, capacitances in fF.
time_unit_ps=1
driving_cell=BUFx2_ASAP7_75t_R
output_load=10.0
abc_output_load=10.0

# NAND2xp33 (0.05832) is smaller, but dont_use below.
ge_cell=NAND2x1_ASAP7_75t_R
ge_area=0.08748

icg=ICGx1_ASAP7_75t_R CLK ENA SE GCLK
latch_p=DHLx1_ASAP7_75t_R CLK D Q
latch_n=DLLx1_ASAP7_75t_R CLK D Q
# OpenROAD-flow-scripts' list (platforms/asap7/config.mk) without ICG*: the fractional-drive cells and
# the scan flops.
dont_use=*x1p*_ASAP7* *xp*_ASAP7* SDF*
