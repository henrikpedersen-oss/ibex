# IHP SG13G2 130 nm BiCMOS, sg13g2_stdcell (lib/README.md). Format: lib/nangate45.cfg.

name=ihp-sg13g2
title=IHP SG13G2

# The only corner in OpenROAD-flow-scripts v3.0 and OpenROAD 26Q2 (no slow one).
typical=ihp-sg13g2/sg13g2_stdcell_typ_1p20V_25C.lib

time_unit_ps=1000
driving_cell=sg13g2_buf_2
# pF (10 fF)
output_load=0.010
abc_output_load=10.0

ge_cell=sg13g2_nand2_1
ge_area=7.2576

# The liberty marks both clock gates dont_use; genus/syn.tcl clears it for the instantiated one.
icg=sg13g2_slgcp_1 CLK GATE SCE GCLK
latch_p=sg13g2_dlhq_1 GATE D Q
# No active-low latch without a reset: the one with a reset, held inactive.
latch_n=sg13g2_dllrq_1 GATE_N D Q RESET_B=1'b1
# OpenROAD-flow-scripts' list (platforms/ihp-sg13g2/config.mk).
dont_use=sg13g2_antennanp sg13g2_lgcp_1 sg13g2_sighold sg13g2_slgcp_1 sg13g2_dfrbp_2
