# SkyWater SKY130, high-density cells (lib/README.md). Format: lib/nangate45.cfg.

name=sky130hd
title=SKY130 sky130_fd_sc_hd

typical=sky130hd/sky130_fd_sc_hd__tt_025C_1v80.lib
# 1.40 V, -40 C: the slow corner OpenROAD ships (sky130's 1.60 V, 100 C one is not in it)
slow=sky130hd/sky130_fd_sc_hd__ss_n40C_1v40.lib

time_unit_ps=1000
driving_cell=sky130_fd_sc_hd__buf_2
# pF (10 fF)
output_load=0.010
abc_output_load=10.0

ge_cell=sky130_fd_sc_hd__nand2_1
ge_area=3.7536

icg=sky130_fd_sc_hd__sdlclkp_1 CLK GATE SCE GCLK
latch_p=sky130_fd_sc_hd__dlxtp_1 GATE D Q
latch_n=sky130_fd_sc_hd__dlxtn_1 GATE_N D Q
# OpenROAD-flow-scripts' list (platforms/sky130hd/config.mk): probe points and the multi-power-domain
# lpflow cells.
dont_use=sky130_fd_sc_hd__probe_p_* sky130_fd_sc_hd__probec_p_* sky130_fd_sc_hd__lpflow_*
