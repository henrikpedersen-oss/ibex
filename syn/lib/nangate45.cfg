# Synthesis library description, read by lib/syn_lib.sh (both flows) and scripts/syn_lib.py (reports).
# One key=value per line; '#' starts a comment. Liberty paths are relative to lib/, flow files
# (yosys_*, genus_*) to ibex/syn. Keys:
#   typical, slow, fast   liberty file(s) of each corner the library has (space-separated if several)
#   time_unit_ps          the liberty's time unit in ps (SDC periods and delays are in it)
#   driving_cell          cell driving every input (set_driving_cell)
#   output_load           load on every output, liberty capacitance units (OpenSTA, Genus)
#   abc_output_load       the same load in fF (ABC's -constr file is always fF)
#   ge_cell, ge_area      the gate equivalent: the smallest usable NAND2 and its liberty area (um^2)
#   icg                   integrated clock gate for Genus: cell, clock, enable, test-enable, gated clock
#   latch_p, latch_n      Yosys latch map: cell, enable, data, output [PIN=value ties]; _p transparent
#                         while the enable is high, _n while it is low
#   dont_use              cell patterns no logic is mapped onto (marked in lib/generated/)
#   yosys_latch_map, yosys_sdc, yosys_abc_sdc, genus_clock_gating
#                         fixed files instead of generated ones (NanGate45 only: its results stay
#                         those of the flow before the library choice existed)

name=nangate45
title=NanGate45

typical=NangateOpenCellLibrary_typical.lib
slow=NangateOpenCellLibrary_slow.lib
fast=NangateOpenCellLibrary_fast.lib

time_unit_ps=1000
driving_cell=BUF_X2
# fF
output_load=10.0
abc_output_load=10.0

ge_cell=NAND2_X1
ge_area=0.798

icg=CLKGATETST_X1 CK E SE GCK
latch_p=DLH_X1 G D Q
latch_n=DLL_X1 GN D Q
dont_use=

yosys_latch_map=rtl/latch_map.v
yosys_sdc=ibex_top.nangate.sdc
yosys_abc_sdc=ibex_top_abc.nangate.sdc
genus_clock_gating=genus/prim_clock_gating.v
