# ===============================
# * EXPERIMENTAL CONFIGURATIONS *
# ===============================

# Smallest CHERIoT core that keeps SecureIbex: a control processor that leaves data movement to an
# external DMA. Slow multiplier (keeps M so rv32emc binaries run), no B, Zca only, no cache, PMP,
# debug triggers or performance counters, no branch target ALU. The writeback stage stays: CHERIoT
# requires it (doc/03_reference/cheriot.rst, IllegalParamCHERIoTNoWriteback in ibex_core). RV32E
# is the CHERIoT register set; with dummy instructions on it does not change the register file's
# storage. Flip-flop register file: the latch one has no reset, and with SecureIbex the ECC checks of
# dummy-instruction reads see X before every register is written (unverified with CHERIoT).
cheriot-min:
  BaseIsa                  : "ibex_pkg::BaseIsaRV32IorCHERIoT"
  RV32E                    : 1
  RV32M                    : "ibex_pkg::RV32MSlow"
  RV32B                    : "ibex_pkg::RV32BNone"
  RV32ZC                   : "ibex_pkg::RV32Zca"
  RegFile                  : "ibex_pkg::RegFileFF"
  BranchTargetALU          : 0
  WritebackStage           : 1
  ICache                   : 0
  ICacheECC                : 0
  ICacheScramble           : 0
  BranchPredictor          : 0
  FetchOutputReg           : 0
  DataIfReg                : 0
  DbgTriggerEn             : 0
  SecureIbex               : 1
  PMPEnable                : 0
  PMPGranularity           : 0
  PMPNumRegions            : 4
  MHPMCounterNum           : 0
  MHPMCounterWidth         : 40

# cheriot-min with the core's bus requests from flops (FetchOutputReg, DataIfReg): for timing
# evaluation in synthesis only (make genus-synth SYN_CONFIG=cheriot-min-outreg). Not simulated by
# the verification plan: on the RTOS test SoC it does not boot (2026-10-19: first fetch from 0 after
# the loader). Making it work, and closing timing, is the RTL team's (status/rtl_tickets.md).
cheriot-min-outreg:
  BaseIsa                  : "ibex_pkg::BaseIsaRV32IorCHERIoT"
  RV32E                    : 1
  RV32M                    : "ibex_pkg::RV32MSlow"
  RV32B                    : "ibex_pkg::RV32BNone"
  RV32ZC                   : "ibex_pkg::RV32Zca"
  RegFile                  : "ibex_pkg::RegFileFF"
  BranchTargetALU          : 0
  WritebackStage           : 1
  ICache                   : 0
  ICacheECC                : 0
  ICacheScramble           : 0
  BranchPredictor          : 0
  FetchOutputReg           : 1
  DataIfReg                : 1
  DbgTriggerEn             : 0
  SecureIbex               : 1
  PMPEnable                : 0
  PMPGranularity           : 0
  PMPNumRegions            : 4
  MHPMCounterNum           : 0
  MHPMCounterWidth         : 40

